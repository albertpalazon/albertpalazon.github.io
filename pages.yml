name: Refresh intelligence and deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Refresh official CISA catalog
        continue-on-error: true
        run: python3 scripts/update_intel.py
      - name: Refresh RansomLook public posts
        continue-on-error: true
        run: python3 scripts/update_ransomware.py
      - name: Refresh MalwareBazaar metadata
        continue-on-error: true
        env:
          ABUSECH_AUTH_KEY: ${{ secrets.ABUSECH_AUTH_KEY }}
        run: python3 scripts/update_malware.py
      - name: Refresh DDoS provider incident reports
        continue-on-error: true
        run: python3 scripts/update_ddos_incidents.py
      - name: Refresh Cloudflare outages and BGP
        continue-on-error: true
        env:
          CLOUDFLARE_RADAR_TOKEN: ${{ secrets.CLOUDFLARE_RADAR_TOKEN }}
        run: python3 scripts/update_cloudflare.py
      - name: Validate bundled feeds
        run: |
          python3 -c "import json; from pathlib import Path; d=json.loads(Path('dist/data/kev.json').read_text()); assert d['vulnerabilities']; r=json.loads(Path('dist/data/ransomware.json').read_text()); assert r['posts']; m=json.loads(Path('dist/data/malware.json').read_text()); assert isinstance(m['samples'],list)"
      - name: Check monitor context and filters
        run: |
          python3 scripts/test_context.py
          python3 scripts/test_ddos_incidents.py
          python3 scripts/test_radar_signals.py
          node scripts/test_monitors.mjs
      - name: Check public artifacts
        env:
          CLOUDFLARE_RADAR_TOKEN: ${{ secrets.CLOUDFLARE_RADAR_TOKEN }}
          ABUSECH_AUTH_KEY: ${{ secrets.ABUSECH_AUTH_KEY }}
        run: python3 scripts/check_public_files.py
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
